plugins { id 'com.android.application' }

android {
    namespace 'ua.komirka'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'ua.komirka'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            if (rootProject.file('.tools/debug.keystore').exists()) storeFile rootProject.file('.tools/debug.keystore')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', rootProject.file('.tools/m2').absolutePath
            systemProperty 'komirka.screenshots', rootProject.file('artifacts/screenshots').absolutePath
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

